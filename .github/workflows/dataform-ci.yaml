name: Dataform CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dataform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (offline, Dataform CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compile with the Dataform CLI
        run: |
          DATAFORM_CORE_VERSION=$(awk -F': *' '$1 == "dataformCoreVersion" { print $2 }' workflow_settings.yaml)
          npx --yes "@dataform/cli@${DATAFORM_CORE_VERSION}" compile

  run-pipeline:
    name: Run pipeline in isolated datasets
    needs: compile
    # PRs from forks don't get an OIDC token, and their commits don't exist on the remote synced by Dataform.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      DATAFORM_REPOSITORY: ${{ vars.DATAFORM_REPOSITORY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_CD_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Compile and run the pipeline with assertions
        run: ./scripts/dataform/run_pr_pipeline.sh "${PR_NUMBER}" "${PR_HEAD_SHA}"
